name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable # latest patched toolchain (go.mod's `go` line stays the language minimum)
          cache: true
      - name: Lint (gofmt + vet)
        run: make lint
      - name: Test (race)
        run: make test-race
      - name: Build
        run: make build
